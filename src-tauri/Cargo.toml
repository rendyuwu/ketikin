[package]
name = "ketikin"
version = "0.1.0"
description = "Simple cross-platform auto-typer for consoles that don't accept clipboard paste."
authors = ["rendyuwu"]
license = "MIT"
repository = "https://github.com/rendyuwu/ketikin"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ketikin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
enigo = "0.6.1"
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
thiserror = "2.0.20"
# `time` only: the 30 s update-check deadline and the background poll interval.
tokio = { version = "1.53.1", features = ["time"] }
uuid = { version = "1.20.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
