<!--
  The run-state tray icon: the app icon with one mark added, shown while Ketikin
  is typing. Source of tray-run.png, which tray.rs embeds; nothing else consumes
  this file.

  Not a redraw. Every coordinate here is icon.svg's, on the same 16-unit grid, so
  the two states differ by exactly one shape and the icon does not appear to
  change identity when a run starts. Read the comment in icon.svg first: the
  reasons the geometry is what it is live there, and they all still apply.

  The added mark is a second knockout, a 2x2 dot centred over the caret. The
  constraints it is drawn to, in order of how easily they are broken:

  1. It survives 16 pixels. 2x2 units is 2 real pixels there, on whole-unit
     coordinates, so it renders as four solid pixels rather than a smudge. A 1x1
     dot would have been invisible; a stroked ring would have had a line weight
     to lose, which is the mistake the old icon was made of.
  2. It never touches the keycap. Five units of brass to its left and right, three
     above it. A mark that reaches an edge reads as a nick in the key at small
     sizes instead of a mark on it.
  3. It carries no colour of its own. The macOS variant of this icon has to be a
     template image (black plus alpha, tinted by the system), so a run marker that
     meant something through hue would simply not exist there. This one is a
     shape difference and reads in a single tint. See
     tray-macos-template-run.svg, which is the same mark at 18/16 scale.
  4. It is a knockout, in the tile's own colour over an opaque ground, which is
     identical to a mask and keeps the file to four shapes.

  A dot rather than filling the caret in: dropping the caret would take away the
  one mark that makes this icon a keycap being typed into, so the running state
  would read as less rather than more.

  (No double hyphens below this line: XML forbids them inside a comment.)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 16 16">
  <!-- Graphite tile -->
  <rect width="16" height="16" rx="3.5" ry="3.5" fill="#1A1C1F"/>

  <!-- Brass keycap: one solid form, no bevel, no inset face -->
  <rect x="2" y="2" width="12" height="12" rx="2.5" ry="2.5" fill="#E2A33C"/>

  <!-- Run marker, knocked out of the keycap -->
  <rect x="7" y="5" width="2" height="2" fill="#1A1C1F"/>

  <!-- Caret, knocked out of the keycap -->
  <rect x="4" y="11" width="8" height="2" fill="#1A1C1F"/>
</svg>
